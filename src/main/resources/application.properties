spring.application.name=transport-orders-api

# Base de datos H2 en memoria
spring.datasource.url=jdbc:h2:mem:transportdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Archivos
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
app.storage.dir=${STORAGE_DIR:uploads}

# JWT
app.jwt.secret=${JWT_SECRET:dev-secret}
app.jwt.expiration-minutes=60

# Logs en JSON
logging.structured.format.console=logstash
logging.level.com.transportes.api=INFO

# Swagger
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
